# TMUX.CONF
# =========

# Appearance
# ==========
source ~/.config/tmux/theme.conf
set -g cursor-style bar
set -g status-position top
set -g automatic-rename on
set -g set-titles on
set -g set-titles-string "#{session_name}:#{window_index}:#{window_name}"

# Terminal support
# ================
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-256color:RGB"
# Support complex underline styles (e.g. curly)
set -ga terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Support complex underline colors
set -ga terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g set-clipboard on
set -g mouse on
set -g repeat-time 400
set -g escape-time 0
set -g allow-passthrough on
set -g extended-keys on
set -g extended-keys-format csi-u

# Windows and sessions
# ====================
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -g monitor-activity on
set -g visual-activity off
set -g bell-action none
set -g visual-bell off
set -g visual-silence off
set -g detach-on-destroy off

# Key bindings
# ============
set -g prefix C-b
set -g mode-keys vi
set -g status-keys vi

# <prefix>r reloads the configuration.
bind r { source ~/.config/tmux/tmux.conf; display "Configuration reloaded..."; }
